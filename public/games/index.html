    const value = Math.random() < 0.9 ? 2 : 4;
    const id = this.nextId++;
    this.tiles.set(id, { id, r, c, value, node: null, fresh: true });
  }

  tileClass(value) {
    if (value <= 64) return 'tv-' + value;
    if (value <= 2048) return 'tv-' + value;
    return 'tv-big';
  }

  paint() {
    const m = this.metrics();
    for (const t of this.tiles.values()) {
      if (!t.node) {
        t.node = el('div', 'tm-tile', this.layer);
        t.node.classList.add('spawn');
        setTimeout(() => t.node && t.node.classList.remove('spawn'), 240);
      }
      t.node.textContent = String(t.value);
      t.node.className = 'tm-tile ' + this.tileClass(t.value) + (t.value >= 1024 ? ' small-text' : '');
      t.node.style.width = m.cell + 'px';
      t.node.style.height = m.cell + 'px';
      t.node.style.transform = `translate(${m.padX + t.c * (m.cell + m.gap)}px, ${m.padY + t.r * (m.cell + m.gap)}px)`;
    }
  }

  move(dr, dc) {
    if (this.moving) return;
    const lines = [];
    if (dr !== 0) {
      for (let c = 0; c < 4; c++) {
        const line = [];
        for (let r = 0; r < 4; r++) line.push([dr === 1 ? 3 - r : r, c]);
        lines.push(line);
      }
    } else {
      for (let r = 0; r < 4; r++) {
        const line = [];
        for (let c = 0; c < 4; c++) line.push([r, dc === 1 ? 3 - c : c]);
        lines.push(line);
      }
    }

    const at = (r, c) => {
      for (const t of this.tiles.values()) if (t.r === r && t.c === c) return t;
      return null;
    };

    let movedAny = false;
    let gained = 0;
    const merges = [];
    const removals = [];

    for (const line of lines) {
      const stack = line.map(([r, c]) => at(r, c)).filter(Boolean);
      let write = 0;
      let prev = null;
      for (const tile of stack) {
        if (prev && prev.value === tile.value && !prev.mergedThisTurn) {
          const [tr, tc] = line[write - 1];
          if (tile.r !== tr || tile.c !== tc) movedAny = true;
          tile.r = tr; tile.c = tc;
          prev.value *= 2;
          prev.mergedThisTurn = true;
          gained += prev.value;
          merges.push(prev);
          removals.push(tile);
          movedAny = true;
          prev = null;
        } else {
          const [tr, tc] = line[write];
          if (tile.r !== tr || tile.c !== tc) movedAny = true;
          tile.r = tr; tile.c = tc;
          prev = tile;
          write++;
        }
      }
    }

    if (!movedAny) return;
    this.moving = true;
    this.paint();

    setTimeout(() => {
      for (const dead of removals) {
        this.tiles.delete(dead.id);
        if (dead.node) { dead.node.remove(); dead.node = null; }
      }
      for (const t of this.tiles.values()) t.mergedThisTurn = false;
      for (const m of merges) {
        if (m.node) {
          m.node.classList.remove('bounce');
          void m.node.offsetWidth;
          m.node.classList.add('bounce');
        }
      }
      if (gained > 0) {
        this.score += gained;
        this.hud.setScore(this.score, true);
      }
      this.spawn();
      this.paint();
      this.moving = false;
      this.checkGameOver();
    }, 150);
  }

  checkGameOver() {
    if (this.emptyCells().length > 0) return;
    const grid = Array.from({ length: 4 }, () => Array(4).fill(0));
    for (const t of this.tiles.values()) grid[t.r][t.c] = t.value;
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        if (r < 3 && grid[r][c] === grid[r + 1][c]) return;
        if (c < 3 && grid[r][c] === grid[r][c + 1]) return;
      }
    }
    const top = Math.max(...Array.from(this.tiles.values()).map(t => t.value));
    this.hud.gameOver({
      eyebrow: 'Tile Merge',
      title: 'No more moves',
      extra: `Highest tile · ${top}`,
      primaryLabel: 'Play again',
      onPrimary: () => App.navigate('tile-merge')
    });
  }

  destroy() {
    window.removeEventListener('keydown', this.onKey);
    this.root.innerHTML = '';
  }
}

/* ============================================================
   Game 3: Color Flood
   ============================================================ */
/* === CUSTOMIZE: FLOOD COLORS === */
const CF_PALETTE = [
  { name: 'Slate Blue', hex: '#64748b' },
  { name: 'Lake Green', hex: '#14b8a6' },
  { name: 'Pink', hex: '#f43f5e' },
  { name: 'Amber', hex: '#f59e0b' },
  { name: 'Indigo', hex: '#6366f1' }
];

class ColorFlood {
  constructor(root, hud) {
    this.root = root;
    this.hud = hud;
    this.size = 12;
    /* === CUSTOMIZE: FLOOD MOVE LIMIT === */
    this.maxMoves = 25;
    this.movesUsed = 0;
    this.animating = false;
    this.over = false;
    this.grid = Array.from({ length: 144 }, () => randInt(5));
    this.par = this.computePar();
    this.build();
    this.paint(null);
  }

  neighbors(i) {
    const r = Math.floor(i / 12), c = i % 12;
    const out = [];
    if (r > 0) out.push(i - 12);
    if (r < 11) out.push(i + 12);
    if (c > 0) out.push(i - 1);
    if (c < 11) out.push(i + 1);
    return out;
  }

  region(grid) {
    const color = grid[0];
    const seen = new Set([0]);
    const dist = new Map([[0, 0]]);
    const queue = [0];
    while (queue.length) {
      const cur = queue.shift();
      for (const n of this.neighbors(cur)) {
        if (!seen.has(n) && grid[n] === color) {
          seen.add(n);
          dist.set(n, dist.get(cur) + 1);
          queue.push(n);
        }
      }
    }
    return { cells: seen, dist };
  }

  floodResult(grid, color) {
    const { cells } = this.region(grid);
    const next = grid.slice();
    for (const i of cells) next[i] = color;
    return next;
  }

  computePar() {
    let sim = this.grid.slice();
    let steps = 0;
    while (steps < 60) {
      const { cells } = this.region(sim);
      if (cells.size === 144) break;
      let bestColor = -1;
      let bestSize = -1;
      for (let color = 0; color < 5; color++) {
        if (color === sim[0]) continue;
        const trial = this.floodResult(sim, color);
        const size = this.region(trial).cells.size;
        if (size > bestSize) { bestSize = size; bestColor = color; }
      }
      sim = this.floodResult(sim, bestColor);
      steps++;
    }
    return Math.min(steps + 2, this.maxMoves - 1);
  }

  build() {
    const stage = el('div', 'game-stage', this.root);
    const stats = el('div', 'substats', stage);
    this.movesChip = this.makeChip(stats, 'Moves left', String(this.maxMoves));
    this.parChip = this.makeChip(stats, 'Par', String(this.par));
    this.ownedChip = this.makeChip(stats, 'Filled', '');

    this.boardEl = el('div', 'cf-board', stage);
    this.cells = [];
    for (let i = 0; i < 144; i++) this.cells.push(el('div', 'cf-cell', this.boardEl));
    this.cells[0].classList.add('origin');

    const palette = el('div', 'cf-palette', stage);
    this.swatches = CF_PALETTE.map((color, idx) => {
      const b = el('button', 'cf-swatch', palette);
      b.style.background = color.hex;
      b.setAttribute('aria-label', color.name);
      b.title = color.name;
      b.addEventListener('click', () => this.play(idx));
      return b;
    });

    const hint = el('div', 'hint', stage);
    hint.textContent = 'Start from the top-left. Fill the whole board before you run out of moves. Under par is a perfect run.';
    this.updateStats();
  }

  makeChip(parent, label, value) {
    const chip = el('div', 'chip', parent);
    const l = el('span', 'label', chip);
    l.textContent = label;
    const v = el('span', 'value', chip);
    v.textContent = value;
    return v;
  }

  paint(waveDist) {
    for (let i = 0; i < 144; i++) {
      const cell = this.cells[i];
      if (waveDist && waveDist.has(i)) {
        cell.style.transitionDelay = Math.min(waveDist.get(i) * 22, 700) + 'ms';
      } else {
        cell.style.transitionDelay = '0ms';
      }
      cell.style.background = CF_PALETTE[this.grid[i]].hex;
    }
  }

  updateStats() {
    const owned = this.region(this.grid).cells.size;
    this.movesChip.textContent = String(this.maxMoves - this.movesUsed);
    this.ownedChip.textContent = owned + ' / 144';
    this.swatches.forEach((b, idx) => {
      b.disabled = idx === this.grid[0] || this.animating || this.over;
      b.classList.toggle('active', idx === this.grid[0]);
    });
  }

  play(color) {
    if (this.animating || this.over || color === this.grid[0]) return;
    const { cells, dist } = this.region(this.grid);
    this.grid = this.floodResult(this.grid, color);
    this.movesUsed++;
    this.animating = true;
    this.updateStats();
    const maxDelay = Math.min(Math.max(...cells.size ? [...dist.values()] : [0]) * 22, 700);
    this.paint(dist);
    setTimeout(() => {
      this.animating = false;
      for (const cell of this.cells) cell.style.transitionDelay = '0ms';
      this.updateStats();
      this.checkEnd();
    }, maxDelay + 260);
  }

  checkEnd() {
    const owned = this.region(this.grid).cells.size;
    const remaining = this.maxMoves - this.movesUsed;
    if (owned === 144) {
      this.over = true;
      const score = remaining * 500;
      this.hud.setScore(score);
      const perfect = this.movesUsed <= this.par;
      if (perfect) this.flashPerfect();
      setTimeout(() => {
        this.hud.gameOver({
          eyebrow: 'Color Flood',
          title: perfect ? 'Perfect fill' : 'Board filled',
          extra: `Used ${this.movesUsed} moves (par ${this.par}) · ${remaining} moves left became your score`,
          primaryLabel: 'Play again',
          onPrimary: () => App.navigate('color-flood')
        });
      }, perfect ? 1500 : 400);
    } else if (remaining <= 0) {
      this.over = true;
      this.hud.setScore(0);
      this.hud.gameOver({
        eyebrow: 'Color Flood',
        title: 'Out of moves',
        extra: `Filled ${owned} / 144 cells`,
        primaryLabel: 'Play again',
        onPrimary: () => App.navigate('color-flood')
      });
    }
  }

  flashPerfect() {
    const wrap = el('div', 'cf-perfect', document.body);
    const text = el('span', '', wrap);
    text.textContent = 'Perfect!';
    setTimeout(() => wrap.remove(), 1500);
  }

  destroy() {
    this.root.innerHTML = '';
  }
}

/* ============================================================
   Game 4: Path Connector
   ============================================================ */
/* === CUSTOMIZE: PATH COLORS === */
const PC_COLORS = ['#6366f1', '#14b8a6', '#f43f5e', '#f59e0b', '#38bdf8', '#a78bfa', '#34d399', '#e879f9'];

class PathConnector {
  constructor(root, hud) {
    this.root = root;
    this.hud = hud;
    this.size = 6;
    this.level = 1;
    this.totalScore = 0;
    this.multiplier = 1;
    this.build();
    this.startLevel();
  }

  build() {
    const stage = el('div', 'game-stage', this.root);
    const stats = el('div', 'substats', stage);
    this.levelChip = this.makeChip(stats, 'Level', '1');
    this.multChip = this.makeChip(stats, 'Bonus', '×1.0');
    this.penChip = this.makeChip(stats, 'Penalty', '0');

    this.wrap = el('div', 'pc-wrap', stage);
    this.boardEl = el('div', 'pc-board', this.wrap);
    for (let i = 0; i < 36; i++) el('div', 'pc-cell', this.boardEl);
    this.svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    this.svg.setAttribute('class', 'pc-svg');
    this.wrap.appendChild(this.svg);

    const actions = el('div', 'substats', stage);
    const reset = el('button', 'btn-ghost', actions);
    reset.textContent = 'Restart this level';
    reset.addEventListener('click', () => this.resetLevel());

    const hint = el('div', 'hint', stage);
    hint.textContent = 'Drag a line between dots of the same color. Lines can\'t cross. Chain solves without redoing lines for a bigger bonus.';

    this.onDown = (e) => this.pointerDown(e);
    this.onMove = (e) => this.pointerMove(e);
    this.onUp = () => this.pointerUp();
    this.wrap.addEventListener('pointerdown', this.onDown);
    window.addEventListener('pointermove', this.onMove);
    window.addEventListener('pointerup', this.onUp);
  }

  makeChip(parent, label, value) {
    const chip = el('div', 'chip', parent);
    const l = el('span', 'label', chip);
    l.textContent = label;
    const v = el('span', 'value', chip);
    v.textContent = value;
    return v;
  }

  generateLevel() {
    for (let attempt = 0; attempt < 400; attempt++) {
      const owner = Array(36).fill(-1);
      const paths = [];
      let failed = false;
      while (true) {
        const empty = [];
        for (let i = 0; i < 36; i++) if (owner[i] === -1) empty.push(i);
        if (!empty.length) break;
        let cur = pick(empty);
        const id = paths.length;
        const path = [cur];
        owner[cur] = id;
        const targetLen = 4 + randInt(5);
        while (path.length < targetLen) {
          const options = this.adjacent(cur).filter(n => owner[n] === -1);
          if (!options.length) break;
          cur = pick(options);
          owner[cur] = id;
          path.push(cur);
        }
        if (path.length < 3) { failed = true; break; }
        paths.push(path);
      }
      if (!failed && paths.length >= 4 && paths.length <= 7) {
        return paths.map((p, i) => ({ color: PC_COLORS[i], a: p[0], b: p[p.length - 1] }));
      }
    }
    return [
      { color: PC_COLORS[0], a: 0, b: 35 },
      { color: PC_COLORS[1], a: 5, b: 30 },
      { color: PC_COLORS[2], a: 14, b: 21 },
      { color: PC_COLORS[3], a: 2, b: 33 }
    ];
  }

  adjacent(i) {
    const r = Math.floor(i / 6), c = i % 6;
    const out = [];
    if (r > 0) out.push(i - 6);
    if (r < 5) out.push(i + 6);
    if (c > 0) out.push(i - 1);
    if (c < 5) out.push(i + 1);
    return out;
  }

  startLevel() {
    this.pairs = this.generateLevel();
    this.paths = this.pairs.map(() => ({ cells: [], complete: false }));
    this.active = null;
    this.redundant = 0;
    this.levelChip.textContent = String(this.level);
    this.penChip.textContent = '0';
    this.renderMult();
    this.draw();
  }

  resetLevel() {
    this.multiplier = 1;
    this.renderMult();
    this.paths = this.pairs.map(() => ({ cells: [], complete: false }));
    this.active = null;
    this.redundant = 0;
    this.penChip.textContent = '0';
    this.draw();
  }

  renderMult() {
    this.multChip.textContent = '×' + this.multiplier.toFixed(1);
  }

  cellOwner(idx) {
    for (let p = 0; p < this.paths.length; p++) {
      if (this.paths[p].cells.includes(idx)) return p;
    }
    return -1;
  }

  endpointAt(idx) {
    for (let p = 0; p < this.pairs.length; p++) {
      if (this.pairs[p].a === idx || this.pairs[p].b === idx) return p;
    }
    return -1;
  }

  cellFromEvent(e) {
    const rect = this.boardEl.getBoundingClientRect();
    const pad = 8;
    const step = (rect.width - pad * 2) / 6;
    const c = Math.floor((e.clientX - rect.left - pad) / step);
    const r = Math.floor((e.clientY - rect.top - pad) / step);
    if (r < 0 || c < 0 || r > 5 || c > 5) return -1;
    return r * 6 + c;
  }

  pointerDown(e) {
    e.preventDefault();
    const idx = this.cellFromEvent(e);
    if (idx < 0) return;
    const ep = this.endpointAt(idx);
    if (ep >= 0) {
      if (this.paths[ep].complete || this.paths[ep].cells.length > 0) {
        this.breakStreak();
      }
      this.paths[ep] = { cells: [idx], complete: false };
      this.active = ep;
      this.draw();
      return;
    }
    const owner = this.cellOwner(idx);
    if (owner >= 0 && !this.paths[owner].complete) {
      const cells = this.paths[owner].cells;
      const pos = cells.indexOf(idx);
      const removed = cells.length - 1 - pos;
      if (removed > 0) this.addPenalty(removed);
      this.paths[owner].cells = cells.slice(0, pos + 1);
      this.active = owner;
      this.draw();
    }
  }

  pointerMove(e) {
    if (this.active === null) return;
    e.preventDefault();
    const target = this.cellFromEvent(e);
    if (target < 0) return;
    let guard = 0;
    while (this.active !== null && guard++ < 12) {
      const last = this.paths[this.active].cells[this.paths[this.active].cells.length - 1];
      if (target === last) return;
      const next = this.stepToward(last, target);
      if (next === -1) return;
      const advanced = this.tryExtend(next);
      if (!advanced) return;
    }
  }

  stepToward(from, to) {
    const fr = Math.floor(from / 6), fc = from % 6;
    const tr = Math.floor(to / 6), tc = to % 6;
    if (fr === tr && fc !== tc) return from + Math.sign(tc - fc);
    if (fc === tc && fr !== tr) return from + Math.sign(tr - fr) * 6;
    if (this.adjacent(from).includes(to)) return to;
    if (Math.abs(tc - fc) >= Math.abs(tr - fr)) return from + Math.sign(tc - fc);
    return from + Math.sign(tr - fr) * 6;
  }

  tryExtend(idx) {
    const path = this.paths[this.active];
    const cells = path.cells;
    const last = cells[cells.length - 1];
    if (idx === last) return false;

    const pos = cells.indexOf(idx);
    if (pos >= 0) {
      const removed = cells.length - 1 - pos;
      this.addPenalty(removed);
      path.cells = cells.slice(0, pos + 1);
      this.draw();
      return true;
    }

    if (!this.adjacent(last).includes(idx)) return false;

    const pair = this.pairs[this.active];
    const otherEndpoint = this.endpointAt(idx);
    if (otherEndpoint >= 0 && otherEndpoint !== this.active) return false;
    const owner = this.cellOwner(idx);
    if (owner >= 0 && owner !== this.active) return false;

    cells.push(idx);
    const start = cells[0];
    const goal = start === pair.a ? pair.b : pair.a;
    if (idx === goal) {
      path.complete = true;
      this.active = null;
      this.multiplier = Math.min(3, this.multiplier + 0.25);
      this.renderMult();
      this.draw();
      this.checkLevelComplete();
      return true;
    }
    this.draw();
    return true;
  }

  pointerUp() {
    this.active = null;
  }

  addPenalty(cellCount) {
    this.redundant += cellCount;
    this.penChip.textContent = String(this.redundant * 50);
  }

  breakStreak() {
    this.multiplier = 1;
    this.renderMult();
  }

  checkLevelComplete() {
    if (!this.paths.every(p => p.complete)) return;
    const base = Math.round(1000 * this.multiplier);
    const levelScore = Math.max(100, base - this.redundant * 50);
    this.totalScore += levelScore;
    this.hud.setScore(this.totalScore, true);
    const finishedLevel = this.level;
    setTimeout(() => {
      Overlay.show({
        eyebrow: 'Path Connector',
        title: `Level ${finishedLevel} complete`,
        score: this.totalScore,
        best: this.hud.best,
        newBest: this.totalScore >= this.hud.best && this.totalScore > 0,
        extra: `+${levelScore} (base ${base}, penalty ${this.redundant * 50})`,
        primaryLabel: 'Next level',
        onPrimary: () => {
          this.level++;
          this.startLevel();
        }
      });
    }, 650);
  }

  draw() {
    const rect = this.boardEl.getBoundingClientRect();
    const pad = 8;
    const step = (rect.width - pad * 2) / 6;
    const center = (idx) => {
      const r = Math.floor(idx / 6), c = idx % 6;
      return [pad + c * step + step / 2, pad + r * step + step / 2];
    };
    this.svg.setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);
    this.svg.setAttribute('width', rect.width);
    this.svg.setAttribute('height', rect.height);
    this.svg.innerHTML = '';

    this.paths.forEach((path, i) => {
      if (path.cells.length < 2) return;
      const d = path.cells.map((idx, j) => {
        const [x, y] = center(idx);
        return (j === 0 ? 'M' : 'L') + x + ' ' + y;
      }).join(' ');
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      line.setAttribute('d', d);
      line.setAttribute('class', 'pc-path' + (path.complete ? ' complete' : ''));
      line.setAttribute('stroke', this.pairs[i].color);
      line.setAttribute('stroke-width', step * 0.34);
      line.style.color = this.pairs[i].color;
      this.svg.appendChild(line);
    });

    this.pairs.forEach((pair, i) => {
      for (const idx of [pair.a, pair.b]) {
        const [x, y] = center(idx);
        const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        dot.setAttribute('cx', x);
        dot.setAttribute('cy', y);
        dot.setAttribute('r', step * 0.26);
        dot.setAttribute('fill', pair.color);
        dot.setAttribute('class', 'pc-node' + (this.paths[i].complete ? ' complete' : ''));
        dot.style.color = pair.color;
        this.svg.appendChild(dot);
      }
    });
  }

  destroy() {
    window.removeEventListener('pointermove', this.onMove);
    window.removeEventListener('pointerup', this.onUp);
    this.root.innerHTML = '';
  }
}

<script>
/* Score bridge: caretaker embeds this file in an iframe (/popo/games) and keeps the
   leaderboard. Every time a game writes a new personal best, tell the parent window;
   the parent is the only thing that talks to the database. Standalone (no parent),
   these posts go nowhere and the file behaves exactly as it did before. */
(function () {
  if (window.parent === window) return;
  const titles = {};
  for (const [id, def] of Object.entries(App.registry)) titles[id] = def.title;

  const set = Store.set.bind(Store);
  Store.set = function (key, value) {
    set(key, value);
    if (typeof key !== 'string' || !key.startsWith('mp-best-')) return;
    const gameId = key.slice('mp-best-'.length);
    if (!titles[gameId] || !value) return;
    window.parent.postMessage(
      { type: 'caretaker-game-score', gameId, gameTitleZh: titles[gameId], score: value },
      window.location.origin
    );
  };

  // Hand over whatever this browser already had, so the board is never empty on first load.
  for (const [gameId, title] of Object.entries(titles)) {
    const best = Store.get('mp-best-' + gameId, 0);
    if (best > 0) {
      window.parent.postMessage(
        { type: 'caretaker-game-score', gameId, gameTitleZh: title, score: best },
        window.location.origin
      );
    }
  }
})();
</script>
